
<div class="game-data"
     data-name-en="CONTRABAND"
     data-name-vi="BUÔN LẬU"
     data-origin-en="Liar Game"
     data-origin-vi="Liar Game"
     data-description-en="A strategic smuggling mind game where players conceal information, calculate risks, and read their opponents."
     data-description-vi="Trò chơi đấu trí về buôn lậu, nơi người chơi phải che giấu thông tin, tính toán rủi ro và đọc vị đối thủ."
     data-game="../GAMES/Contraband/main.html">

    <div class="game-illustration">

<svg viewBox="0 0 300 220"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Minimal open briefcase with a small tilted bundle of green cash">

    <!-- Open lid: same width as the suitcase base -->
    <rect x="25" y="8" width="250" height="61"
          fill="#6841A5"
          stroke="#B99AFF"
          stroke-width="2"/>

    <rect x="36" y="18" width="228" height="41"
          fill="#17121F"/>

    <!-- Hinges connecting lid and base -->
    <g fill="#D8C5FF" stroke="#6841A5" stroke-width="1.5">
        <rect x="70" y="63" width="25" height="15"/>
        <rect x="205" y="63" width="25" height="15"/>
    </g>

    <g fill="#6841A5">
        <circle cx="82.5" cy="70.5" r="3"/>
        <circle cx="217.5" cy="70.5" r="3"/>
    </g>

    <!-- Tall suitcase base: square corners -->
    <rect x="25" y="73" width="250" height="136"
          fill="#6841A5"
          stroke="#B99AFF"
          stroke-width="2"/>

    <!-- Inner compartment: square corners -->
    <rect x="36" y="84" width="228" height="114"
          fill="#111018"/>

    <!-- Small tilted bundle of cash -->
    <g transform="translate(150 141) rotate(-12)">

        <!-- Bundle edges -->
        <rect x="-35" y="-13" width="70" height="32"
              fill="#087443"/>

        <rect x="-35" y="-18" width="70" height="32"
              fill="#12A85D"/>

        <!-- Top banknote: no rounded corners -->
        <rect x="-35" y="-23" width="70" height="32"
              fill="#43F28B"
              stroke="#D0FFDF"
              stroke-width="1.5"/>

        <!-- Minimal banknote border -->
        <rect x="-29" y="-17" width="58" height="20"
              fill="none"
              stroke="#087443"
              stroke-width="1.5"/>

        <!-- Simple emblem -->
        <ellipse cx="0" cy="-7" rx="7" ry="5"
                 fill="#087443"
                 stroke="#D0FFDF"
                 stroke-width="1"/>

        <path d="M0 -10 V-4"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="1.5"/>

        <!-- Simplified single band -->
        <rect x="-4" y="-22" width="8" height="30"
              fill="#FFFFFF"/>
    </g>

    <!-- Simple front clasp -->
    <rect x="138" y="201" width="24" height="7"
          fill="#FFFFFF"/>

    <rect x="145" y="202" width="10" height="5"
          fill="#6841A5"/>

</svg>

    </div>

</div>
